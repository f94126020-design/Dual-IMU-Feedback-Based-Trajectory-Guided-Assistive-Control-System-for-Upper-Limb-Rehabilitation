# Motor Control System - Quick Configuration
# 馬達控制系統 - 快速配置

## GPIO PIN CONFIGURATION (BCM Mode)
## GPIO 引腳配置 (BCM 模式)

# Deltoid Motor (三角肌/肩膀馬達)
DELTOID_PWM_PIN = 17    # PWM 信號引腳
DELTOID_DIR_PIN = 27    # 方向控制引腳

# Biceps Motor (二頭肌/彎曲馬達)
BICEPS_PWM_PIN = 22     # PWM 信號引腳
BICEPS_DIR_PIN = 23     # 方向控制引腳

# Triceps Motor (三頭肌/伸展馬達)
TRICEPS_PWM_PIN = 24    # PWM 信號引腳
TRICEPS_DIR_PIN = 25    # 方向控制引腳

## PWM FREQUENCY (Hz)
## PWM 頻率 (赫茲)
PWM_FREQUENCY = 1000    # 1 kHz - 適合大多數馬達

## PID CONTROLLER PARAMETERS
## PID 控制器參數

# Deltoid PID (肩膀馬達 PID)
DELTOID_KP = 1.5        # 比例增益 (Proportional)
DELTOID_KI = 0.1        # 積分增益 (Integral)
DELTOID_KD = 0.05       # 微分增益 (Derivative)

# Biceps PID (二頭肌馬達 PID)
BICEPS_KP = 1.2
BICEPS_KI = 0.1
BICEPS_KD = 0.05

# Triceps PID (三頭肌馬達 PID)
TRICEPS_KP = 1.2
TRICEPS_KI = 0.1
TRICEPS_KD = 0.05

## CONTROL SENSITIVITY
## 控制靈敏度

# 肩膀抬起角度 → 馬達速度的轉換係數
SHOULDER_SPEED_SCALE = 0.5     # 增大 = 更靈敏

# 手肘角度 → 馬達速度的轉換係數
ELBOW_SPEED_SCALE = 1.0        # 增大 = 更靈敏

## MOTION DETECTION THRESHOLDS
## 運動檢測閾值

ANGLE_THRESHOLD = 5.0           # 最小角度變化 (度)
VELOCITY_THRESHOLD = 8.0        # 最小速度 (度/秒)

## DATA SAMPLING RATE
## 數據採樣率

DATA_UPDATE_INTERVAL = 0.05     # 50 ms = 20 Hz
# 減少值 = 更快反應，但 CPU 負荷更高
# 增加值 = 更平緩，但反應延遲

## ANGLE LIMITS
## 角度限制

MAX_SHOULDER_ANGLE = 90.0       # 最大肩膀抬起角度 (度)
MAX_ELBOW_ANGLE = 120.0         # 最大手肘彎曲角度 (度)

## WEB SERVER CONFIGURATION
## 網頁伺服器配置

WEB_HOST = '0.0.0.0'            # 監聽所有網卡
WEB_PORT = 5000                 # 網頁伺服器端口
WEB_DEBUG = False               # 調試模式 (生產環境應為 False)

## I2C CONFIGURATION
## I2C 配置

I2C_BUS = 1                     # Raspberry Pi I2C 總線 (通常為 1)
TCA_ADDRESS = 0x70              # TCA9548A 多路複用器地址
MPU_ADDRESS = 0x68              # MPU6050 IMU 地址

IMU_UPPER_ARM_CHANNEL = 0       # 上臂 IMU - TCA 通道 0
IMU_FOREARM_CHANNEL = 1         # 前臂 IMU - TCA 通道 1

## MOTOR DIRECTION CORRECTION
## 馬達方向修正

# 如果馬達反向轉動，改變以下值 (0=正向, 1=反向)
DELTOID_REVERSE = 0
BICEPS_REVERSE = 0
TRICEPS_REVERSE = 0

## CALIBRATION PARAMETERS
## 校準參數

GYRO_CALIBRATION_SAMPLES = 100  # 陀螺儀校準樣本數 (約 10 秒@10Hz)
POSE_CALIBRATION_MODE = "manual" # "manual" 或 "auto"

## ADVANCED SETTINGS - 進階設置

# 啟用/禁用自動控制
ENABLE_AUTO_CONTROL = True

# 啟用/禁用手動控制
ENABLE_MANUAL_CONTROL = True

# 馬達電源節流 (電池節能模式)
POWER_SAVING_MODE = False
POWER_SAVING_THRESHOLD = 20     # 低於此百分比時啟用省電

# 記錄馬達命令到日誌
LOG_MOTOR_COMMANDS = False

---

## 使用說明

1. 根據實際硬體配置修改 GPIO 引腳號
2. 根據馬達特性調整 PID 參數
3. 保存此文件為參考

## 典型 Raspberry Pi 引腳分佈

```
        ┌─────────────────┐
      1 │ 3V3             │ 2   5V
      3 │ SDA             │ 4   5V
      5 │ SCL             │ 6   GND
      7 │ GPIO4           │ 8   TXD
      9 │ GND             │ 10  RXD
   17 │ GPIO17 (PWM1)   │ 12  GPIO18
   27 │ GPIO27 (DIR1)   │ 14  GND
   22 │ GPIO22 (PWM2)   │ 16  GPIO23 (DIR2)
   GND │ GND             │ 18  GPIO24 (PWM3)
   10 │ SPI_MOSI        │ 20  GND
   11 │ SPI_CLK         │ 22  GPIO25 (DIR3)
        └─────────────────┘
```

## 常見問題排查

Q: 馬達不轉？
A: 1. 檢查 GPIO 引腳號
   2. 檢查馬達驅動模組電源
   3. 檢查 GPIO 權限 (sudo 或加入 gpio 組)

Q: 馬達抖動或反應遲鈍？
A: 1. 調整 PID 參數 (增加 Kp)
   2. 增加採樣率 (減少 DATA_UPDATE_INTERVAL)
   3. 檢查電源供應

Q: IMU 無法初始化？
A: 1. 執行 i2cdetect -y 1 檢查 I2C 設備
   2. 確認 TCA 地址為 0x70
   3. 確認 MPU 地址為 0x68

